[entity-description]
boat=Un bote pequeño y rápido con poco espacio de almacenamiento. Puede colocarse en una vía acuática o como vehículo independiente.
cargo_ship=Un barco grande capaz de transportar una gran cantidad de recursos.
oil_tanker=Un barco grande capaz de transportar una gran cantidad de fluidos.
pump=Puede colocarse en el agua para cargar o descargar petroleros.
oil_rig=Una plataforma para extraer grandes cantidades de petróleo en alta mar. Tiene una fuente de alimentación interna (a menos que esté desactivada) y una red eléctrica para suministrar energía a la propia plataforma y a las bombas conectadas a ella.
offshore-oil=Una gran cantidad de petróleo que yace en el fondo del mar. Se necesita una plataforma petrolífera para extraerlo.
port=Destino de los barcos que operan de forma automática.
buoy=Divide una vía acuática en varios bloques, lo que permite que varios barcos viajen en una sola red de vía acuática.
chain_buoy=Lee la siguiente boya de señalización en la ruta para un mejor control del barco.
bridge_base=Un puente ferroviario móvil automatizado que permite el paso de barcos por debajo. Requiere la instalación adicional de una boya de señalización cercana o una señal de tren para funcionar correctamente.

[item-name]
waterway=vía acuática

[item-description]
waterway=Una ruta acuática por la que viajan los barcos.

