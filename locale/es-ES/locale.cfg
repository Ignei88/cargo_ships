automated_water_transport=Automatización del transporte acuático
tank_ship=ENTITY__oil_tanker
deep_sea_oil_extraction=Extracción de petróleo en alta mar
automated_bridges=Puentes automatizados

[technology-description]
cargo_ships=Permite el transporte a gran escala a través de vías acuáticas.
oversea-energy-distribution=Proporciona un medio para conectar islas a la red eléctrica principal.
water_transport=Proporciona un medio para viajar a través del agua.
automated_water_transport=Permite la construcción de puertos para establecer rutas acuáticas automatizadas.
tank_ship=Permite el transporte de fluidos por vías acuáticas. El ENTITY__oil_tanker puede ser cargado y descargado con bombas.
deep_sea_oil_extraction=Permite la extracción de petróleo del ENTITY__offshore-oil.
automated_bridges=Permite la construcción de puentes donde se cruzan vías ferroviarias y vías acuáticas.

[mod-setting-name]
offshore_oil_enabled=Habilitar plataformas petrolíferas y petróleo en alta mar
fuel_modifier=Modificador de capacidad de combustible del barco
speed_modifier=Modificador de velocidad de movimiento del barco
no_shallow_oil=No generar petróleo en alta mar en aguas poco profundas
waterway_reach_increase=Aumentar el alcance de construcción cuando se tienen objetos de agua en la mano
no_oil_for_oil_rig=No se necesitan paquetes de ciencia de química para el desarrollo del ENTITY__oil_rig
use_dark_blue_waterways=Usar vías acuáticas de color azul oscuro
oil_rig_capacity=Capacidad de la ENTITY__oil_rig x1000
oil_rigs_require_external_power=Fuente de alimentación interna de la plataforma petrolífera
tanker_capacity=Capacidad del ENTITY__oil_tanker x1000
no_catching_fish=Deshabilitar la pesca con pinzas
prevent_waterway_rail_connections=Evitar que las vías acuáticas se conecten a otros tipos de raíles

[mod-setting-description]
fuel_modifier=Este valor se multiplica por la capacidad de combustible estándar de un barco.
waterway_reach_increase=Aumenta el alcance de construcción del jugador cuando tiene vías acuáticas, puertos, boyas, etc., en la mano, lo que permite la construcción y deconstrucción de vías acuáticas desde una distancia mayor. Poner a 0 para deshabilitar el aumento de alcance de construcción.
no_oil_for_oil_rig=Impide que los paquetes de ciencia de química sean un requisito previo para la plataforma petrolífera. Habilítelo si juega sin petróleo terrestre.
no_shallow_oil=Habilita el comportamiento clásico, que impide la generación de petróleo en alta mar en aguas poco profundas.
use_dark_blue_waterways=Cambia el color de las vías acuáticas a un tono más oscuro, lo que mejora la visibilidad. (Solo afecta a las vías acuáticas antiguas en este momento)
speed_modifier=Multiplica la velocidad de movimiento del barco por este valor. Advertencia: Los barcos que viajan a alta velocidad se ven extraños.
oil_rig_capacity=La capacidad interna de la plataforma petrolífera.
oil_rigs_require_external_power=[font=default-bold]Pequeña:[/font] La plataforma petrolífera tiene una pequeña fuente de alimentación interna que puede ser complementada con una red eléctrica al usar módulos (este es el modo predeterminado).\n[font=default-bold]Ninguna:[/font] La plataforma petrolífera solo funcionará cuando esté conectada a una red eléctrica.\n[font=default-bold]Infinita:[/font] La plataforma petrolífera no se puede conectar a una red eléctrica, pero siempre funciona a plena potencia.
tanker_capacity=Capacidad de almacenamiento del petrolero.
no_catching_fish=Evita que las pinzas pesquen cuando se colocan junto al agua.
prevent_waterway_rail_connections=Cuando se selecciona, las vías acuáticas no pueden conectarse a otros tipos de raíles.

[string-mod-setting]
oil_rigs_require_external_power-enabled=ninguno
oil_rigs_require_external_power-only-when-moduled=pequeño
oil_rigs_require_external_power-disabled=infinito

