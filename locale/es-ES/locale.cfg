[tips-and-tricks-item-name]
cargo-ships=Cargueros

[tips-and-tricks-item-description]
cargo-ships=Coloca tus barcos en una vía acuática recta. La opción de vía acuática se puede ver haciendo clic en el botón de vía acuática en la barra de acceso rápido, o presionando CONTROL__give-waterway. El bote puede colocarse en una vía acuática o como un vehículo independiente que se conduce como un coche.\n\nLos petroleros se pueden cargar/descargar con hasta 3 bombas. Cuando sostienes una bomba, se te mostrarán las posiciones de colocación válidas.
